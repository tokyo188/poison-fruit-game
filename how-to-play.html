<h1>How to Play</h1>

<ol>
<li>Select the number of fruits.</li>
<li>Select the number of poison fruits.</li>
<li>Each player secretly assigns poison fruits.</li>
<li>Players take turns eating fruits.</li>
<li>If you eat a poison fruit, you lose a life.</li>
<li>The last surviving player wins.</li>
</ol>
